<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e19" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="DIMA GIFT Festa 2026 스탬프투어 HTML 디자인 프로토타입"
    />
    <title>DIMA GIFT 스탬프투어 디자인</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ar-style.css" />    
    <script src="./js/8frame-1.5.0.min.js"></script>
    <script src="./js/xrextras.js"></script>
    <script async src="./js/xr.js" data-preload-chunks="slam"></script>
    <script>
    (function () {
        // 🌟 [추가] 개발 환경(localhost)이거나 PC 환경일 경우 인앱 체크를 무시합니다.
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
            return; 
        }

        var userAgent = navigator.userAgent.toLowerCase();
        // 차단할 인앱 브라우저 키워드 목록
        var targetInApp = ['kakaotalk', 'naver', 'instagram', 'fb_iab', 'fb4a', 'fban', 'line'];
        var isInApp = false;

        for (var i = 0; i < targetInApp.length; i++) {
            if (userAgent.indexOf(targetInApp[i]) !== -1) {
                isInApp = true;
                break;
            }
        }

        if (isInApp) {
            // 안드로이드 기기인 경우 크롬 브라우저로 강제 이동 시도
            if (userAgent.indexOf('android') !== -1) {
                alert('안정적인 스탬프투어 진행을 위해 크롬(Chrome) 브라우저로 이동합니다.');
                
                // 🌟 [수정] 현재 프로토콜(http/https)을 자동으로 감지하여 intent 스키마 생성
                var currentScheme = location.protocol === 'https:' ? 'https' : 'http';
                var targetUrl = location.href.replace(/^https?:\/\//i, '');
                
                location.href = 'intent://' + targetUrl + '#Intent;scheme=' + currentScheme + ';package=com.android.chrome;end';
            }
            // 아이폰(iOS) 기기인 경우 사파리로 열도록 안내
            else if (userAgent.indexOf('iphone') !== -1 || userAgent.indexOf('ipad') !== -1) {
                alert('안정적인 스탬프투어 진행을 위해 화면 우측 하단의 [Safari로 열기] 또는 [기본 브라우저로 열기] 버튼을 눌러주세요!');
            }
            // 기타
            else {
                alert('현재 브라우저에서는 스탬프 기록이 유실될 수 있습니다. 크롬이나 사파리 브라우저 앱을 켜고 주소를 직접 입력해 접속해주세요.');
            }

            // 인앱 브라우저에서는 더 이상 화면이 그려지지 않도록 HTML 내용을 비워버림 (강제 차단)
            document.write('<div style="text-align:center; padding:50px; font-family:sans-serif;"><h3>기본 브라우저(크롬, 사파리)로 접속해주세요!</h3><p>현재 앱에서는 스탬프 기록이 저장되지 않습니다.</p></div>');
            document.close();
        }
    })();
</script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header" id="app-header"></header>
      <main class="app-main" id="app" tabindex="-1"></main>
    </div>

    <div class="modal-root" id="modal-root" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <div class="noscript">이 디자인 프로토타입은 JavaScript를 활성화해야 확인할 수 있습니다.</div>
    </noscript>
    <script src="app.js" defer></script>
    <script src="ar-app.js" defer></script>
  </body>
</html>
