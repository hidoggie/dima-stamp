<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0e19" />
  <meta name="description" content="DIMA GIFT Festa 2026 스탬프투어 오픈 준비 중" />
  <title>DIMA GIFT 스탬프투어 - 준비 중</title>
  <style>
    /* 기존 스타일 가이드 컬러셋 적용 */
    :root {
      --bg: #0d0e19;
      --bg-top: #17162b;
      --g: #e5007f;
      --i: #890c84;
      --f: #381f87;
      --t: #f18e29;
    }
    
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #080910;
      color: #ffffff;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    /* 배경 그라데이션 효과 */
    .bg-elements {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 0%, rgba(95, 51, 184, 0.24), transparent 32rem),
        radial-gradient(circle at 90% 90%, rgba(229, 0, 127, 0.12), transparent 28rem);
      z-index: 1;
    }

    /* 중앙 카드 레이아웃 */
    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px 30px;
      background: radial-gradient(circle at 50% -8%, rgba(89, 48, 169, 0.28), transparent 27rem),
                  linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 46%, #0a0b14 100%);
      border: 1px solid rgba(127, 104, 190, 0.3);
      border-radius: 29px;
      box-shadow: 0 28px 82px rgba(0, 0, 0, 0.5);
      max-width: 420px;
      width: 85%;
      animation: fade-in 0.6s ease-out both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.08em;
      margin-bottom: 25px;
      color: #c291ff;
      background: rgba(104, 49, 182, 0.36);
      border: 1px solid rgba(158, 98, 250, 0.17);
      border-radius: 999px;
      display: inline-block;
      padding: 6px 16px;
    }

    .title {
      font-size: clamp(28px, 8vw, 36px);
      font-weight: 900;
      margin: 0 0 16px;
      font-family: "Segoe Print", "Brush Script MT", cursive;
      font-style: italic;
      letter-spacing: -0.04em;
    }

    /* GIFT 각각의 컬러 적용 */
    .title .g { color: var(--g); }
    .title .i { color: #d345c9; }
    .title .f { color: #8668ee; }
    .title .t { color: var(--t); }

    .desc {
      font-size: 15px;
      color: #bdb8cd;
      line-height: 1.6;
      margin-bottom: 35px;
      word-break: keep-all;
    }

    /* 빙글빙글 도는 로딩 스피너 */
    .spinner {
      margin: 0 auto;
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="bg-elements"></div>
  <div class="container">
    <div class="brand">DIMA CONNECT</div>
    <h1 class="title">
      <span class="g">G</span>·<span class="i">I</span>·<span class="f">F</span>·<span class="t">T</span> Festa 2026
    </h1>
    <div class="desc">
      스탬프투어 서비스 오픈을 위해<br>현재 페이지 시스템을 준비 중입니다.<br><br>조금만 기다려주세요!
    </div>
    <div class="spinner"></div>
  </div>
</body>
</html>
